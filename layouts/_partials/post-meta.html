<div class="post-meta">
  <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format ":date_long" }}</time>
  <span aria-hidden="true">·</span>
  <span>{{ .ReadingTime }} min de lecture</span>
  {{ with .GetTerms "tags" }}
  <span class="tags">
    {{ range . }}<a class="tag" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ end }}
  </span>
  {{ end }}
</div>
