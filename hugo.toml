baseURL = "https://crocogab.github.io/"
locale = "fr-FR"
defaultContentLanguage = "fr"
title = "Gabriel Diyan"
enableRobotsTXT = true
summaryLength = 30
capitalizeListTitles = false

[params]
  description = "Étudiant ingénieur en cybersécurité · bug bounty, CTF, sécurité offensive"
  author = "Gabriel Diyan"
  avatar = "images/avatar.png"
  email = "diyangabriel8@gmail.com"
  github = "https://github.com/crocogab"
  yeswehack = "https://yeswehack.com/users/0xcr0c0"
  rootme = "https://www.root-me.org/Crocogab"
  leakwatch = "https://leakwatch.net"
  
  postSections = ["recherche", "writeups"]

[taxonomies]
  tag = "tags"

[menus]
  [[menus.main]]
    name = "À propos"
    pageRef = "/a-propos"
    weight = 1
  [[menus.main]]
    name = "Projets"
    pageRef = "/projets"
    weight = 2
  [[menus.main]]
    name = "Recherche"
    pageRef = "/recherche"
    weight = 3
  [[menus.main]]
    name = "Writeups"
    pageRef = "/writeups"
    weight = 4
  [[menus.main]]
    name = "Tags"
    pageRef = "/tags"
    weight = 5

[markup]
  [markup.goldmark.renderer]
    unsafe = false
  [markup.highlight]
    noClasses = false
    lineNos = false
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 3

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
